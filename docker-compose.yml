services:
  db:
    image: postgres:16
    container_name: data-gen-db
    environment:
      POSTGRES_USER: datagen
      POSTGRES_PASSWORD: datagen
      POSTGRES_DB: datagen
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U datagen -d datagen" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  data-gen:
    image: ewanf2/flask-app
    container_name: data-gen
    environment:
      DATABASE_URL: postgresql://datagen:datagen@db:5432/datagen
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5050/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "5050:80"
volumes:
  pgdata:
